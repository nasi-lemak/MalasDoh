name: Mobile

# Builds the Android and iOS apps and runs each, briefly, in an emulator, to
# catch a crash at start. Nothing is uploaded: the screenshot is printed in
# the log.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android (build, and run in the ${{ matrix.device }} emulator)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [pixel_7, pixel_tablet]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build the APK
        run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME android/build-apk.sh
      - name: Pillow, for the screenshot
        run: python3 -m pip install --break-system-packages pillow
      # For the phone's end-to-end run: a throwaway user with a password, on
      # port 2222, which the emulator reaches as 10.0.2.2.
      - name: An SSH server to connect to
        if: matrix.device == 'pixel_7'
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          sudo useradd -m -s /bin/bash demo
          echo 'demo:malasdoh-ci-only' | sudo chpasswd
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222 -o PasswordAuthentication=yes -o KbdInteractiveAuthentication=no
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run it in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.device }}
          disable-animations: true
          script: E2E=${{ matrix.device == 'pixel_7' && '1' || '0' }} sh .github/scripts/android-smoke.sh

  ios:
    name: iOS (build, and run in the Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      # For iPhones and iPads; only built, since signing needs an Apple account.
      - name: Build for devices
        run: cargo build --release --target aarch64-apple-ios -p malasdoh-ios
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      - name: Build the Simulator app
        run: ios/build-app.sh
      - name: Pillow, for the screenshot
        run: python3 -m pip install --break-system-packages pillow
      - name: Run it in the Simulator
        run: sh .github/scripts/ios-smoke.sh
