[workspace]
resolver = "3"
members = ["crates/malasdoh-core", "crates/malasdoh", "crates/malasdoh-ohos"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/nasi-lemak/MalasDoh"
license = "GPL-3.0-or-later"

[workspace.dependencies]
malasdoh-core = { path = "crates/malasdoh-core" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
russh = { version = "0.64", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
similar = "2"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tempfile = "3"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
keyring = "4"
vt100 = "0.16"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
egui = "0.36"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
