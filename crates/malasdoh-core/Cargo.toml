[package]
name = "malasdoh-core"
description = "Connections, SSH sessions, SFTP and safe remote editing for MalasDoh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
russh.workspace = true
russh-sftp.workspace = true
serde.workspace = true
toml.workspace = true
directories.workspace = true
similar.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true
uuid.workspace = true
time.workspace = true
hmac.workspace = true
sha1.workspace = true
base64.workspace = true
keyring.workspace = true
serde_json = "1"
yaml-rust2 = "0.13"
rand = "0.10"
ring = "0.17"
# Teleport: its web API and TLS-routed SSH. ring, like russh.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
# Teleport's gRPC API (listing servers with the login's certificate).
h2 = "=0.4.12"
http = "=1.3.1"
bytes = "1"
# Built-in WireGuard: the protocol, and a small TCP/IP stack inside the tunnel.
boringtun = { version = "=0.7.1", default-features = false }
socket2 = "0.6"
smoltcp = { version = "=0.12.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-cubic", "socket-udp", "socket-dns", "proto-dns"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
